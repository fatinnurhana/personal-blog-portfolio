<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me - Fatin Nurhana</title>
    <!-- 🌟 DIPERBAIKI: Menggunakan CDN FontAwesome terkini supaya ikon tidak kosong lagi! -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap">
    
    <style>
        /* --- 1. TETAPAN ASAS --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fffaf8;
            margin: 0;
            display: flex;
        }

        /* --- 2. STYLING SIDEBAR (DIPERBAIKI IKUT IMAGE_3E7A08.PNG) --- */
        .sidebar {
            width: 280px; /* Lebar ditambah sikit untuk keselesaan menu kapsul */
            background: #fff;
            padding: 40px 24px;
            height: 100vh;
            position: fixed;
            border-right: 2px dashed #ffcbd1;
            box-shadow: 2px 0 10px rgba(0,0,0,0.01);
            box-sizing: border-box;
            text-align: left; /* Teks sejajar ke kiri mengikut imej contoh */
        }
        .profile-img {
            width: 130px; /* Saiz dibesarkan sedikit mengikut gambar profil Fatin */
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ffcbd1;
            margin-bottom: 10px;
        }
        .sidebar h1 {
            font-family: 'Fredoka', cursive;
            font-size: 1.8rem;
            color: #4a4a4a;
            margin: 15px 0 8px 0;
        }
        .sidebar-bio {
            font-size: 0.95rem;
            color: #7a7a7a;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .social-icons {
            display: flex;
            gap: 12px;
            margin: 25px 0;
        }
        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #fff5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff7676;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            border: 1px solid #ffcbd1;
            transition: all 0.2s ease;
        }
        .icon-btn:hover {
            background: #ffe3e5;
            transform: translateY(-2px);
        }

        /* STYLING MENU KAPSUL SEPERTI DALAM GAMBAR */
        .sidebar-nav a {
            display: block;
            padding: 14px 24px;
            color: #ff7676;
            text-decoration: none;
            border-radius: 25px; /* Membujur sepenuhnya seperti kapsul */
            margin-bottom: 12px;
            font-weight: bold;
            background: #fff5f5;
            font-family: 'Fredoka', cursive;
            font-size: 1.05rem;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }
        .sidebar-nav a:hover {
            background: #ffe3e5;
            padding-left: 28px;
        }
        .sidebar-nav a.active {
            background: #ff7676; /* Warna merah jambu terang padu */
            color: white;
            box-shadow: 0 4px 12px rgba(255, 118, 118, 0.3);
        }

        /* --- 3. KANDUNGAN UTAMA (CONTACT PAGE) --- */
        .main-content {
            margin-left: 280px; 
            flex: 1;
            padding: 0 0 40px 0;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Gambar Header Atas */
        .contact-header-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('https://images.unsplash.com/photo-1534536281715-e28d76689b4d?q=80&w=1200&auto=format&fit=crop'); 
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-title {
            font-family: 'Fredoka', cursive;
            font-size: 3.5rem;
            color: white;
            font-weight: bold;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.4);
            letter-spacing: 2px;
        }

        /* Kotak Borang Mesej */
        .form-container {
            max-width: 550px;
            margin: 40px auto;
            padding: 30px;
            background: #ffffff;
            border-radius: 24px;
            border: 2px solid #feebc8;
            box-shadow: 0 8px 24px rgba(255, 179, 179, 0.1);
            box-sizing: border-box;
        }
        .form-container h2 {
            font-family: 'Fredoka', cursive;
            font-size: 2.2rem;
            color: #ff7676;
            margin: 0 0 5px 0;
        }
        .form-subtitle {
            color: #7f8c8d;
            font-size: 0.95rem;
            margin-bottom: 30px;
            margin-top: 0;
        }

        .form-group {
            text-align: left;
            margin-bottom: 22px;
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            font-family: 'Fredoka', cursive;
            font-weight: 600;
            color: #5a5a5a;
            margin-bottom: 8px;
            font-size: 0.95rem;
            margin-left: 4px;
        }
        
        .form-control {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #feebc8;
            border-radius: 14px;
            box-sizing: border-box;
            font-size: 0.95rem;
            background-color: #fffcf9;
            color: #4a4a4a;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-control:focus {
            border-color: #ff7676;
            box-shadow: 0 0 0 4px rgba(255, 118, 118, 0.1);
            outline: none;
        }
        textarea.form-control {
            height: 140px;
            resize: none;
            font-family: inherit;
        }

        .btn-wrapper {
            display: flex;
            justify-content: flex-start;
        }
        .btn-send {
            background-color: #1b264f;
            color: white;
            border: none;
            padding: 14px 40px;
            font-family: 'Fredoka', cursive;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(27, 38, 79, 0.2);
            transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
        }
        .btn-send:hover {
            background-color: #111836;
            box-shadow: 0 6px 16px rgba(27, 38, 79, 0.3);
        }
        .btn-send:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <aside class="sidebar" style="width: 280px; background: #fff; padding: 40px 24px; height: 100vh; position: fixed; border-right: 2px dashed #ffcbd1; box-sizing: border-box; text-align: center;">

    </p>

        <a href="mailto:fatin@example.com" style="width: 42px; height: 42px; border-radius: 50%; background: #ffffff; display: flex; align-items: center; justify-content: center; color: #ea4335; text-decoration: none; border: 2px solid #ffe3e6; box-sizing: border-box; transition: all 0.2s;">

    <!-- KANDUNGAN UTAMA (SEBELAH KANAN) KEKAL BERFUNGSI DENGAN FORMSPREE -->
    <main class="main-content">
        
        <div class="contact-header-img">
            <div class="header-title">Contact</div>
        </div>

        <div class="form-container">
            <h2>Get in Touch</h2>
            <p class="form-subtitle">You can contact me with the contact form below:</p>

            <form action="https://formspree.io/f/mpqnvvqd" method="POST">
                
                <div class="form-group">
                    <label for="name">Name <span style="color: #ff7676;">*</span></label>
                    <input type="text" id="name" name="name" class="form-control" placeholder="Your beautiful name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email <span style="color: #ff7676;">*</span></label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="yourname@email.com" required>
                </div>

                <div class="form-group">
                    <label for="message">Message <span style="color: #ff7676;">*</span></label>
                    <textarea id="message" name="message" class="form-control" placeholder="Write your sweet message here..." required></textarea>
                </div>

                <div class="btn-wrapper">
                    <button type="submit" class="btn-send">Send</button>
                </div>
            </form>
        </div>

    </main>
